name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # nada de .env commitado: a chave nunca deve entrar no binario pelo CI
      - name: Guard against committed credentials
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::arquivo de credenciais versionado: $tracked"
            exit 1
          fi

      - name: Tests
        run: ./tests/run.sh

      - name: Compile (.elf / .smdh / .3dsx)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD":/work -w /work devkitpro/devkitarm \
            bash -c 'export PATH=$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH; make -j"$(nproc)"'

      - name: Fetch makerom
        run: |
          mkdir -p .tools
          curl -fsSL -o /tmp/makerom.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          unzip -oq /tmp/makerom.zip -d .tools
          chmod +x .tools/makerom

      - name: Package the .cia
        run: |
          .tools/makerom -f cia -o immich-3ds.cia \
            -elf immich-3ds.elf \
            -icon immich-3ds.smdh \
            -banner meta/banner.bnr \
            -desc app:2 \
            -rsf app.rsf \
            -target t
          ls -lh immich-3ds.cia immich-3ds.3dsx

      - name: Generate install QR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qrencode
          qrencode -o install-qr.png -s 8 -m 2 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/immich-3ds.cia"
          file install-qr.png

      - uses: actions/upload-artifact@v5
        with:
          name: immich-3ds
          path: |
            immich-3ds.cia
            immich-3ds.3dsx
            install-qr.png
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            immich-3ds.cia
            immich-3ds.3dsx
            install-qr.png
          generate_release_notes: true
          body: |
            ## Install

            **From the console:** FBI → *Remote Install → Scan QR Code*

            ![QR code](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install-qr.png)

            The QR always downloads the newest release.

            **From the SD card:** copy `immich-3ds.cia` to `sdmc:/cias/` and install it with FBI.

            The `.3dsx` is included for the Homebrew Launcher (`sdmc:/3ds/`).
